<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, Outfit, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf8f3"/>
      <stop offset="1" stop-color="#f6e9dc"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#1f1a17" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g fill="#1f1a17" opacity="0.06">
    <circle cx="80" cy="80" r="3"/><circle cx="200" cy="80" r="3"/><circle cx="320" cy="80" r="3"/><circle cx="440" cy="80" r="3"/>
    <circle cx="80" cy="200" r="3"/><circle cx="200" cy="200" r="3"/><circle cx="320" cy="200" r="3"/>
    <circle cx="80" cy="320" r="3"/><circle cx="200" cy="320" r="3"/>
    <circle cx="1520" cy="820" r="3"/><circle cx="1400" cy="820" r="3"/><circle cx="1280" cy="820" r="3"/>
    <circle cx="1520" cy="700" r="3"/><circle cx="1400" cy="700" r="3"/>
    <circle cx="1520" cy="580" r="3"/>
  </g>

  <!-- topbar -->
  <rect x="80" y="56" width="52" height="52" rx="12" fill="#1f1a17"/>
  <text x="106" y="92" text-anchor="middle" font-size="28" font-weight="800" fill="#fdf8f3">D</text>
  <text x="150" y="91" font-size="22" font-weight="700" fill="#1f1a17" letter-spacing="1">Dissemination Digest</text>
  <rect x="402" y="68" width="78" height="28" rx="14" fill="#1f1a17" opacity="0.08"/>
  <text x="441" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#1f1a17" opacity="0.7">V3.4.7</text>

  <!-- mode toggle -->
  <rect x="80" y="190" width="300" height="46" rx="23" fill="#1f1a17" opacity="0.08"/>
  <rect x="84" y="194" width="144" height="38" rx="19" fill="#fdf8f3" filter="url(#sh)"/>
  <text x="156" y="220" text-anchor="middle" font-size="16" font-weight="700" fill="#1f1a17">🎨 Creative</text>
  <text x="304" y="220" text-anchor="middle" font-size="16" font-weight="600" fill="#1f1a17" opacity="0.5">🚀 Startup</text>

  <!-- headline -->
  <text x="80" y="340" font-size="92" font-weight="800" fill="#1f1a17" letter-spacing="-3">Find</text>
  <g transform="translate(300 262) rotate(-2.5)">
    <rect x="0" y="0" width="690" height="104" rx="10" fill="#c2410c"/>
    <text x="24" y="74" font-size="60" font-weight="800" fill="#fdf8f3" letter-spacing="-2">festivals, grants &amp;</text>
  </g>
  <text x="80" y="450" font-size="92" font-weight="800" fill="#1f1a17" letter-spacing="-3">residencies for your</text>
  <text x="80" y="560" font-size="92" font-weight="800" fill="#1f1a17" letter-spacing="-3">creative project.</text>

  <text x="80" y="630" font-size="24" fill="#1f1a17" opacity="0.72">A research assistant scours the web and builds a curated digest you can read right here.</text>

  <!-- CTA -->
  <rect x="80" y="680" width="260" height="64" rx="32" fill="#1f1a17"/>
  <text x="210" y="721" text-anchor="middle" font-size="22" font-weight="700" fill="#fdf8f3">Get my digest →</text>
  <text x="370" y="721" font-size="18" fill="#1f1a17" opacity="0.6">Free · instant result · nothing stored</text>

  <!-- floating cards -->
  <g transform="translate(1090 150) rotate(3)" filter="url(#sh)">
    <rect width="400" height="124" rx="18" fill="#ffffff"/>
    <rect x="22" y="22" width="92" height="26" rx="13" fill="#c2410c" opacity="0.14"/>
    <text x="68" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c" letter-spacing="1">FESTIVAL</text>
    <text x="22" y="80" font-size="22" font-weight="700" fill="#1f1a17">Ars Electronica</text>
    <text x="22" y="106" font-size="15" fill="#1f1a17" opacity="0.6">Linz · digital art · closes Mar 6</text>
  </g>
  <g transform="translate(1040 320) rotate(-2)" filter="url(#sh)">
    <rect width="400" height="124" rx="18" fill="#ffffff"/>
    <rect x="22" y="22" width="72" height="26" rx="13" fill="#c2410c" opacity="0.14"/>
    <text x="58" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c" letter-spacing="1">GRANT</text>
    <text x="22" y="80" font-size="22" font-weight="700" fill="#1f1a17">Australia Council Creative Fund</text>
    <text x="22" y="106" font-size="15" fill="#1f1a17" opacity="0.6">AU · up to $30k · opens Apr 2</text>
  </g>
  <g transform="translate(1110 490) rotate(2)" filter="url(#sh)">
    <rect width="400" height="124" rx="18" fill="#ffffff"/>
    <rect x="22" y="22" width="104" height="26" rx="13" fill="#c2410c" opacity="0.14"/>
    <text x="74" y="40" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c" letter-spacing="1">RESIDENCY</text>
    <text x="22" y="80" font-size="22" font-weight="700" fill="#1f1a17">Rupert</text>
    <text x="22" y="106" font-size="15" fill="#1f1a17" opacity="0.6">Vilnius, Lithuania · 3 months · rolling</text>
  </g>

  <!-- sparkle -->
  <text x="1480" y="120" font-size="40" fill="#c2410c">✦</text>
  <text x="1000" y="700" font-size="26" fill="#c2410c" opacity="0.6">✦</text>
</svg>
